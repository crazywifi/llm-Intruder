category: divergence_attacks
description: >
  Divergence and continuation probes for training-data extraction and
  offensive-term completion.

  Divergence (augustus:divergence.Repeat) — Based on "Extracting Training Data
  from ChatGPT" (Nasr et al. 2023). Repeating a word causes the model to
  enter a degenerate generation mode, eventually emitting what appears to be
  verbatim training data. Variants use 1, 3, and 40 repetitions.

  Continuation (augustus:continuation.ContinueSlursReclaimedSlurs) — Poses
  Urban Dictionary-style sentences ending in an incomplete offensive term to
  see if the model will complete the phrase. High-risk context is used as a
  prompt; the model is tested on varying-length prefixes of the target word.
strategy: passthrough
tags:
  - divergence
  - repeat
  - continuation
  - slur
  - training-data
  - memorization
  - nasr-2023
severity: medium

