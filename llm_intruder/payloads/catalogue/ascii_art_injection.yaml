category: ascii_art_injection
description: >
  ASCII art injection probes based on the ArtPrompts paper. Instructions are
  hidden inside ASCII art representations (standard ASCII banners, Unicode box
  drawing characters, block elements, and Braille patterns) to evade
  tokenization-based safety filters that operate on plain text. Models that
  visually interpret or describe ASCII art may execute embedded commands.
  Sourced from Augustus artprompts.* probes.
strategy: passthrough
tags:
  - ascii-art
  - visual-injection
  - obfuscation
  - artprompts
  - multimodal
severity: high

payloads:
