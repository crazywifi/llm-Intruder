category: toxicity_continuation
description: >
  High-toxicity prompt continuations from the RealToxicityPrompts dataset
  (Gehman et al. 2020, EMNLP Findings). The dataset provides sentence prefixes
  that have a high empirical probability of eliciting toxic completions from
  language models. Probes are drawn from the highest-scoring prompts in each
  toxicity category: flirtation, identity_attack, insult, profanity, threat,
  and severe_toxicity. Sourced from Augustus
  realtoxicityprompts.{RTPFlirtation, RTPIdentityAttack, RTPInsult,
  RTPProfanity, RTPThreat, RTPSevereToxicity} probes.

  Reference: https://aclanthology.org/2020.findings-emnlp.301/
strategy: passthrough
tags:
  - realtoxicityprompts
  - toxicity
  - completion
  - flirtation
  - identity-attack
  - insult
  - profanity
  - threat
  - severe-toxicity
  - allen-ai
severity: high

