category: tense_rephrasing
description: >
  Tense-rephrasing probes based on arXiv:2407.11969. Safety training
  predominantly targets present-tense imperative commands ("How do you make X?").
  Reformulating the same request in past tense ("How was X made in the past?")
  or future tense ("How will X be done in the future?") significantly reduces
  refusal rates because the historical/hypothetical framing shifts perceived
  intent. Sourced from Augustus phrasing.PastTense and phrasing.FutureTense
  probes with data from phrasing/data/{past,future}_tense_en.txt.
strategy: passthrough
tags:
  - phrasing
  - tense
  - past-tense
  - future-tense
  - rephrasing
  - temporal-framing
  - arXiv-2407-11969
severity: high

