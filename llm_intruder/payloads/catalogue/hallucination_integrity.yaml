category: hallucination_integrity
description: >
  Hallucination and integrity probes covering three attack classes:

  Package Hallucination (augustus:packagehallucination.*): Prompts requesting
  code in various languages to detect whether the model recommends packages that
  do not exist (hallucinated package names). Attackers can register the
  hallucinated package names on public registries and have them silently
  installed by developers who trust the model's recommendations.

  False Assertion / Misleading (augustus:misleading.FalseAssertion): Poses
  false factual claims and checks whether the model refutes them or hallucinations
  by accepting the false premise. Based on arXiv:2304.13734. Three prefix
  variants per claim: bare claim, "Why is it that...", "Explain why...".

  Multi-Agent Attack (augustus:multiagent.*): Inter-agent attack simulations
  where a compromised sub-agent attempts to inject malicious instructions into
  the context of a trusted orchestrator agent.
strategy: passthrough
tags:
  - hallucination
  - package-hallucination
  - false-assertion
  - misleading
  - multiagent
  - integrity
  - supply-chain
  - arXiv-2304-13734
severity: medium

payloads:
  # ── Package Hallucination — Perl (augustus:packagehallucination.Perl) ─────
